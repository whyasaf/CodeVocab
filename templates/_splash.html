{# Yükleme ekranı: uygulama açılırken ve sitedeki "Uygulamayı aç" geçişinde gösterilir.
   Stil burada satır içi: dış CSS yüklenmeden de görünsün. #}
<div class="splash{{ ' is-on' if splash_on else '' }}" id="splash" role="status" aria-live="polite">
  <style>
    .splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #000;
      opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s; }
    .splash.is-on { opacity: 1; visibility: visible; transition: opacity .2s ease; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .splash-glow { position: absolute; width: 420px; height: 420px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255,63,164,.28), transparent); animation: splash-breathe 2.4s ease-in-out infinite; }
    .splash img { position: relative; width: 74px; height: 74px; object-fit: contain; animation: splash-pop .6s cubic-bezier(.2,.8,.2,1.2) both; }
    .splash-bar { position: relative; width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    .splash-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #ff3fa4;
      animation: splash-run 1.1s ease-in-out infinite; }
    .splash-text { position: relative; margin: 0; font: 500 13px/1 system-ui, sans-serif; letter-spacing: .04em; color: #6a6a73; }
    @keyframes splash-run { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @keyframes splash-breathe { 0%, 100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes splash-pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .splash-glow, .splash-bar::after, .splash img { animation: none; } }
  </style>
  <div class="splash-glow" aria-hidden="true"></div>
  <div class="splash-inner">
    <img src="{{ url_for('static', filename='codevocablogohead_white.webp') }}" alt="CodeVocab" />
    <span class="splash-bar" aria-hidden="true"></span>
    <p class="splash-text">{{ t("Yükleniyor…") }}</p>
  </div>
</div>
